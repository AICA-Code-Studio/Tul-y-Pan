<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tul y pan</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--a:#18f0ff;--b:#ff6ef9;--c:#2bff3a;--ink:#1a1033}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:Nunito,sans-serif;color:var(--ink);overflow:hidden;
    background:linear-gradient(180deg,var(--a),#c9b6ff 30%,var(--b) 50%,#d9b0cf 70%,var(--c));
    background-size:100% 300%;animation:flow 14s ease-in-out infinite alternate}
  @keyframes flow{to{background-position:0 100%}}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;text-align:center;gap:22px;transition:opacity .8s,transform .8s}
  .hidden{opacity:0;pointer-events:none;transform:scale(.96)}
  h1{font-family:Fraunces,serif;font-size:clamp(2.6rem,11vw,4.5rem);color:#fff;text-shadow:0 3px 18px #0003}
  .sub{font-size:1.1rem;color:#fff;font-weight:700;text-shadow:0 2px 10px #0003}
  .btns{display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
  button{font:700 1.1rem Nunito,sans-serif;padding:16px 20px;border:0;border-radius:999px;cursor:pointer;
    background:#fff;color:var(--ink);box-shadow:0 6px 0 #0002;transition:transform .15s}
  button:hover{transform:translateY(-2px) rotate(-1deg)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}
  button.ghost{background:#ffffff55;color:#fff;backdrop-filter:blur(6px)}
  .card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 18px 40px #0003;width:min(300px,86vw);
    animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
  .card img{width:100%;height:auto;image-rendering:auto;border-radius:12px;display:block}
  @keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
  .flecha{opacity:.9;filter:drop-shadow(0 2px 6px #0003);animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(7px)}}
  a.go{display:inline-block;text-decoration:none;font-weight:700;background:var(--ink);color:#fff;
    padding:14px 26px;border-radius:999px;box-shadow:0 6px 0 #0003}
  .petal{position:fixed;top:-30px;font-size:22px;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  #mute{position:fixed;top:14px;right:14px;padding:10px 14px;font-size:1rem;display:none;z-index:5}
</style>
</head>
<body>
<button id="mute" class="ghost" aria-label="Silenciar">♪</button>

<section class="screen" id="s1">
  <h1>Tul y pan</h1>
  <p class="sub">Tengo algo para vos 🌱</p>
  <div class="btns">
    <button id="conMusica">Ingresar con música 🎹</button>
    <button id="sinMusica" class="ghost">Ingresar sin música</button>
  </div>
</section>

<section class="screen hidden" id="s2">
  <div class="card"><img src="codigo.png" alt="Código de Spotify de la playlist Tul y pan"></div>
  <svg class="flecha" width="28" height="56" viewBox="0 0 28 56" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2 C 10 16, 18 30, 14 50"/><path d="M8 43 L14 51 L20 43"/></svg>
  <a class="go" href="https://open.spotify.com/playlist/7C7AvcWCt4kJRd6ic4k9IL?si=dFu3d1_tSJmsz8OEeFCHzg&utm_source=copy-link" target="_blank" rel="noopener">Abrir en Spotify</a>
</section>

<script>
const $=id=>document.getElementById(id);
let ctx,master,dry,wet,playing=false,sched,nextT,step=0;
const N=n=>440*Math.pow(2,(n-69)/12);
// Línea base: La Mi La Mi Si Mi Si Mi Do Mi Do Mi Re Mi... (corcheas, nota pedal arriba)
const E8=0.36; // duración de cada corchea
const FR=[ // cada frase: nota pedal, 4 notas que se mueven (2 corcheas c/u = 4 corcheas), bajo, melodía [inicio, nota, largo] en corcheas
  {p:64,l:[57,59,60,62],b:45,m:[[0,76,8],[8,77,4],[12,76,4]]},  // La Mi Si Mi Do Mi Re Mi  (Am)
  {p:64,l:[60,59,57,56],b:40,m:[[0,76,8],[8,74,4],[12,71,4]]},  // Do Si La Sol#  (E)
  {p:65,l:[57,60,62,60],b:38,m:[[0,77,8],[8,76,4],[12,74,4]]},  // sobre Fa  (Dm)
  {p:64,l:[60,59,57,59],b:41,m:[[0,72,6],[6,71,2],[8,69,8]]},   // vuelve  (F → Am)
];
// forma por vueltas: 0 solo la línea, 1 + bajo, 2 + melodía, 3 + melodía y bajo en octavas, 4 se apaga
const FORM=[{bass:0,mel:0,v:.75},{bass:1,mel:0,v:.85},{bass:1,mel:1,v:.95},{bass:2,mel:1,v:1},{bass:1,mel:0,v:.6}];

function piano(f,t,d,v){
  const g=ctx.createGain(),lp=ctx.createBiquadFilter();
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(7000,f*6),t);lp.frequency.exponentialRampToValueAtTime(Math.max(350,f*1.3),t+d+1);
  [[1,1],[2,.28],[3,.08],[4,.03]].forEach(([k,a],i)=>{const o=ctx.createOscillator();o.type='sine';
    o.frequency.value=f*k*(1+0.0007*i);o.detune.value=(Math.random()-.5)*3;const og=ctx.createGain();og.gain.value=a;
    o.connect(og);og.connect(lp);o.start(t);o.stop(t+d+3.2)});
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);
  g.gain.exponentialRampToValueAtTime(v*.4,t+.6);g.gain.exponentialRampToValueAtTime(.0001,t+d+3);
  lp.connect(g);g.connect(dry);g.connect(wet);
}
function impulse(sec){const r=ctx.sampleRate,b=ctx.createBuffer(2,r*sec,r);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}return b}
function playPhrase(t,s){
  const sec=FORM[Math.floor(s/4)%FORM.length],f=FR[s%4],hum=()=>(Math.random()-.5)*.015;
  for(let i=0;i<16;i++){const low=i%2===0;const n=low?f.l[Math.floor(i/4)]:f.p;
    piano(N(n),t+i*E8+hum(),E8*1.6,(low?.06:.038)*sec.v*(i%4===0?1.15:1))}
  if(sec.bass){piano(N(f.b),t,E8*14,.09*sec.v);if(sec.bass>1)piano(N(f.b-12),t,E8*14,.07)}
  if(sec.mel)f.m.forEach(([b,n,d])=>piano(N(n),t+b*E8+hum(),d*E8,.075*sec.v));
}
function tick(){while(nextT<ctx.currentTime+1.5){playPhrase(nextT,step++);nextT+=E8*16}}
function startMusic(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(1,ctx.currentTime+1.5);
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
  dry=ctx.createGain();dry.gain.value=.6;wet=ctx.createConvolver();wet.buffer=impulse(4);
  const wg=ctx.createGain();wg.gain.value=.75;
  dry.connect(master);wet.connect(wg);wg.connect(master);master.connect(comp);comp.connect(ctx.destination);
  nextT=ctx.currentTime+.3;tick();sched=setInterval(tick,300);playing=true;$('mute').style.display='block';
}
$('mute').onclick=()=>{if(!ctx)return;playing=!playing;
  master.gain.setTargetAtTime(playing?.9:0,ctx.currentTime,.2);$('mute').textContent=playing?'♪':'✕';};

function petals(){for(let i=0;i<26;i++)setTimeout(()=>{const p=document.createElement('span');
  p.className='petal';p.textContent=['🌸','🌷','🍞','✨','🌱'][i%5];
  p.style.left=Math.random()*100+'vw';p.style.animationDuration=4+Math.random()*4+'s';
  document.body.appendChild(p);setTimeout(()=>p.remove(),9000)},i*180)}

function enter(music){if(music)startMusic();$('s1').classList.add('hidden');
  setTimeout(()=>{$('s2').classList.remove('hidden');petals()},500)}
$('conMusica').onclick=()=>enter(true);
$('sinMusica').onclick=()=>enter(false);
</script>
</body>
</html>
